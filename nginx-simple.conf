server {
    listen 443 ssl;
    server_name metaskepsis.com www.metaskepsis.com;

    ssl_certificate /etc/letsencrypt/live/metaskepsis.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/metaskepsis.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    # Proxy the homepage to your app running on port 8000
    location / {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy /memgame to your Flask app on port 8001
    location /memgame/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy /tutor to your app on port 8002
    location /tutor/ {
        proxy_pass http://127.0.0.1:8002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    
    # Proxy API requests to your backend server
    location /tutor/api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    
    # Proxy /tokenizer to your app on port 8003
    location /tokenizer/ {
        proxy_pass http://127.0.0.1:8003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# HTTP redirect to HTTPS
server {
    listen 80;
    server_name metaskepsis.com www.metaskepsis.com;
    return 301 https://$host$request_uri;
}
